let editingRecordId=null,editingSpendId=null,editingTodoId=null;
(function(){'use strict';
const el=id=>document.getElementById(id), TYPES=[['FAVORITE','收藏・想買・想去','♡'],['MEMORY','生活紀錄・旅行・日常','✈️'],['DAILY','待辦・行程・習慣','✓'],['BEAUTY','美甲・美容・變美紀錄','✦'],['SPENDING','消費紀錄・理財管理','$'],['HEALTH','健康・飲食・運動','♡']];
let active=2,mode='record',coverTarget='BEAUTY',data={records:[],spends:[],todos:[],covers:{}};
try{const old=JSON.parse(localStorage.getItem('mylife-v5')||'null');if(old)data=Object.assign(data,old)}catch(e){}
const save=()=>{
  try{

};
const date=()=>new Date().toISOString().slice(0,10);
function compress(file,max=1400,q=.78){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',q))};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
function imageFor(type){return data.covers[type]||''}
function render(){
  const st=el('stage');st.innerHTML='';

    const d=i-active,cl=d===0?'a':d===-1?'l':d===1?'r':d===-2?'farL':d===2?'farR':'off';
    const card=document.createElement('article'),im=imageFor(c[0]);

    card.innerHTML=(im?'<img src="'+im+'" alt="" decoding="async" '+(Math.abs(i-active)<=1?'':'loading="lazy"')+'>':'<div class="fallback">'+c[2]+'</div>')+
      '<div class="shade"></div><div class="info"><b>'+c[0]+'</b><p>'+c[1]+'</p></div>';
    st.appendChild(card)
  });
  el('dots').innerHTML=TYPES.map((_,i)=>'<i class="dot '+(i===active?'on':'')+'"></i>').join('');
  el('bg').style.backgroundImage='radial-gradient(circle at 8% 12%,rgba(223,214,250,.72) 0 12%,transparent 31%),radial-gradient(circle at 91% 15%,rgba(207,229,255,.78) 0 13%,transparent 33%),radial-gradient(circle at 88% 57%,rgba(247,216,230,.48) 0 10%,transparent 30%),linear-gradient(145deg,#faf8ff 0%,#eef5ff 42%,#f8f1fb 72%,#f8fbff 100%)'
}
let sx=0,lastX=0,startT=0,dragging=false,pointerId=null,startCard=null;
el('stage').addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card');if(!card)return;
  startCard=card;pointerId=e.pointerId;sx=lastX=e.clientX;startT=Date.now();dragging=true;
  try{el('stage').setPointerCapture(pointerId)}catch(_){}
  document.querySelectorAll('.card').forEach(c=>c.style.transition='none')
});
el('stage').addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==pointerId)return;
  lastX=e.clientX;const dx=lastX-sx,cur=el('stage').querySelector('.card.a');
  if(cur&&Math.abs(dx)>3)cur.style.transform=`translate3d(${dx*.72}px,${Math.min(5,Math.abs(dx)*.018)}px,82px) rotateY(${-dx*.04}deg) scale(.998)`
});
function finishSwipe(e){
  if(!dragging||e.pointerId!==pointerId)return;
  dragging=false;
  const dx=e.clientX-sx,dt=Math.max(1,Date.now()-startT),v=Math.abs(dx)/dt;
  document.querySelectorAll('.card').forEach(c=>c.style.transition='transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s');
  if(Math.abs(dx)>24||v>.34){
    active=Math.max(0,Math.min(TYPES.length-1,active+(dx<0?1:-1)));render();return
  }
  const i=startCard?Number(startCard.dataset.index):active;
  if(i!==active){active=i;render();return}
  openCategory(TYPES[active][0])
}
el('stage').addEventListener('pointerup',finishSwipe);
el('stage').addEventListener('pointercancel',e=>{if(!dragging)return;dragging=false;render()});
el('coverPicker').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;data.covers[coverTarget]=await compress(f,760,.68);e.target.value='';save();if(el('settingsModal').classList.contains('on'))renderCoverSettings()});
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>openAdd(b.dataset.add)));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{
  el(b.dataset.close).classList.remove('on');
  unlockPage();
}));function renderCoverSettings(){el('coverSettings').innerHTML=TYPES.map(c=>{const im=imageFor(c[0]);return '<div class="coverRow">'+(im?'<img class="coverMini" src="'+im+'" decoding="async">':'<div class="coverMini">'+c[2]+'</div>')+'<div class="coverName"><b>'+c[0]+'</b><span>'+c[1]+'</span></div><button class="coverChoose" data-setting-cover="'+c[0]+'">選照片</button></div>'}).join('')}
if(el('settingsBtn'))el('settingsBtn').onclick=()=>{if(el('settingGreeting'))el('settingGreeting').value=getGreeting();renderCoverSettings();el('settingsModal').classList.add('on');lockPage()};
el('coverSettings').onclick=e=>{const b=e.target.closest('[data-setting-cover]');if(!b)return;coverTarget=b.dataset.settingCover;el('coverPicker').click()};el('directMemoryBtn').onclick=()=>{el('recordCat').value='MEMORY';openAdd('record');updateMemoryFields()};el('memoryAddBtn').onclick=()=>{el('recordCat').value='MEMORY';openAdd('record');updateMemoryFields()};el('fab').onclick=()=>{const t=el('fab').dataset.type;if(t==='SPENDING')openAdd('spend');else if(t==='DAILY')openAdd('todo');else{el('recordCat').value=t||TYPES[active][0];openAdd('record');updateMemoryFields()}};
function updateMemoryFields(){
 const cat=el('recordCat').value,isMem=cat==='MEMORY';
 el('normalRecordFields').hidden=isMem;
 el('memoryFields').hidden=!isMem;
 if(isMem){
   if(!el('memoryDate').value)el('memoryDate').value=date();
 }else{
   if(!el('recordDate').value)el('recordDate').value=date();
   el('recordPrice').style.display=(cat==='BEAUTY')?'block':'none';
   el('recordPlace').placeholder=(cat==='BEAUTY')?'店家 / 地點':'地點（可不填）';
 }
}el('recordCat').addEventListener('change',updateMemoryFields);function openAdd(m){mode=m;el('addTitle').textContent=m==='record'?'新增生活紀錄':m==='spend'?'新增消費':'新增待辦';el('recordFields').hidden=m!=='record';el('spendFields').hidden=m!=='spend';el('todoFields').hidden=m!=='todo';el('addModal').classList.add('on');lockPage();if(m==='record')updateMemoryFields()}
el('recordPhotos').onchange=e=>{el('photoPreview').innerHTML='';el('memoryPhotoPreview').innerHTML='';[...e.target.files].forEach(f=>{const im=new Image();im.src=URL.createObjectURL(f);el('photoPreview').appendChild(im)})};
el('memoryPhotos').onchange=e=>{el('memoryPhotoPreview').innerHTML='';[...e.target.files].forEach(f=>{const im=new Image();im.src=URL.createObjectURL(f);el('memoryPhotoPreview').appendChild(im)})};

el('saveBtn').onclick=async()=>{
  const btn=el('saveBtn');
  if(btn.dataset.saving==='1')return;
  btn.dataset.saving='1';
  const oldText=btn.textContent;
  btn.textContent='儲存中…';
  btn.disabled=true;

  try{
    if(mode==='record'){
      const rc=el('recordCat').value,isMem=rc==='MEMORY';
      const t=(isMem?el('memoryTitle').value:el('recordTitle').value).trim();
      if(!t){alert('請輸入標題');return}

      const fileInput=isMem?el('memoryPhotos'):el('recordPhotos');
      const files=[...fileInput.files];
      const photos=[];

      /* 一張一張處理：單張照片失敗不會讓整個儲存按鈕失效 */
      for(const f of files){
        try{
          photos.push(await compress(f,isMem?640:1000,isMem?.48:.70));
        }catch(err){
          console.error('photo compress failed',err);
          try{
            photos.push(await new Promise((resolve,reject)=>{
              const fr=new FileReader();
              fr.onload=()=>resolve(fr.result);
              fr.onerror=reject;
              fr.readAsDataURL(f);
            }));
          }catch(e){
            console.error('photo fallback failed',e);

        }
      }

      const recordObj={

        place:(isMem?el('memoryPlace').value:el('recordPlace').value).trim(),
        price:isMem?0:Number(el('recordPrice').value||0),

        mood:isMem?el('memoryMood').value:'',
        date:isMem?(el('memoryDate').value||date()):(el('recordDate').value||date()),
        photos
      };

      if(editingRecordId){
        const old=data.records.find(x=>String(x.id)===String(editingRecordId));
        if(old&&(!recordObj.photos||!recordObj.photos.length))recordObj.photos=old.photos||[];
        const i=data.records.findIndex(x=>String(x.id)===String(editingRecordId));

      }else{
        data.records.push(recordObj);
      }

      /* 先真正寫入成功，再清空表單與關閉視窗 */

          const smaller=[];

          }
          if(smaller.length)recordObj.photos=smaller;
          try{
            localStorage.setItem('mylife-v5',JSON.stringify(data));
            ok=true;
          }catch(secondErr){
            console.error('second save failed',secondErr);
          }
        }
      }

      if(!ok){
        /* 新增失敗時把尚未成功的資料從記憶體撤回，避免假成功 */
        if(!editingRecordId){
          const i=data.records.findIndex(x=>String(x.id)===String(recordObj.id));
          if(i>=0)data.records.splice(i,1);
        }
        alert('這次仍然沒有寫入成功。瀏覽器儲存空間可能已滿；資料沒有被清掉，請先保留這個畫面。');
        return;
      }

      setMemoryMood('');
      ['recordTitle','recordPlace','recordPrice','recordNote','memoryMood','memoryStory','memoryDate','recordDate','memoryTitle','memoryPlace'].forEach(x=>el(x).value='');
      el('recordPhotos').value='';
      el('memoryPhotos').value='';
      el('photoPreview').innerHTML='';
      el('memoryPhotoPreview').innerHTML='';
      render();summary();
      if(window.showSaveSuccess)window.showSaveSuccess('儲存成功');

    }else if(mode==='spend'){
      const t=el('spendTitle').value.trim(),a=Number(el('spendAmount').value);
      if(!t||!a){alert('請輸入消費內容與金額');return}
      const spendObj={id:editingSpendId||Date.now(),title:t,amount:a,cat:el('spendCat').value,date:el('spendDate').value||date()};
      if(editingSpendId){
        const i=data.spends.findIndex(x=>String(x.id)===String(editingSpendId));if(i>=0)data.spends[i]=spendObj
      }else data.spends.push(spendObj);
      editingSpendId=null;
      el('spendTitle').value=el('spendAmount').value='';
      if(!save())return;
    }else{
      const t=el('todoText').value.trim();
      if(!t){alert('請輸入待辦');return}
      data.todos.push({text:t,date:el('todoDate').value||date(),done:false});
      el('todoText').value='';
      if(!save())return;
    }

    el('addModal').classList.remove('on');
    unlockPage();
    const ft=el('fab').dataset.type;
    if(el('fab').classList.contains('on')){
      if(ft==='SPENDING')showSpending();
      else if(ft==='DAILY')showTodos();
      else showType(ft);
    }
  }catch(err){
    console.error('SAVE FATAL',err);
    alert('儲存時發生錯誤，資料沒有被清掉。請重新整理後再試一次。');
  }finally{
    btn.dataset.saving='0';
    btn.disabled=false;
    btn.textContent=oldText;
  }
};

<script id="greetingSettingsJS">
(function(){

<script id="v86StableScrollController">
(function(){
  function greetingEl(){
    return document.getElementById('greetingText') || document.querySelector('.hello b');
  }

  function resizeGreeting(){
    const el=greetingEl(); if(!el)return;
    const n=Array.from((el.textContent||'').trim()).length;
    let px=29;
    if(n>8)px=27;if(n>14)px=24;if(n>20)px=21;if(n>28)px=18;if(n>38)px=16;if(n>50)px=14;
    el.style.fontSize=px+'px';
  }

  function anyOverlayOpen(){
    return !!document.querySelector('.modal.on,.photoViewer.on,.memoryDetail.on');
  }

  function forceUnlockIfSafe(){
    if(anyOverlayOpen()) return;
    document.body.classList.remove('modalLocked');
    document.body.style.position='';
    document.body.style.top='';
    document.body.style.width='';
    document.body.style.left='';
    document.body.style.right='';
    document.body.style.overflow='';
  }

  function syncView(){
    const panel=document.getElementById('panel');
    const home=!(panel && panel.classList.contains('on'));

    document.body.classList.toggle('homeFixed',home);
    document.body.classList.toggle('categoryScroll',!home);
    document.documentElement.classList.toggle('categoryScroll',!home);

    if(home){
      document.body.classList.remove('categoryScroll');
      document.documentElement.classList.remove('categoryScroll');
      resizeGreeting();
    }else{
      forceUnlockIfSafe();
      document.body.style.height='auto';
      document.body.style.minHeight='100vh';
      document.body.style.overflowY='auto';
      document.documentElement.style.overflowY='auto';
    }
  }

  function installCarouselGestureGuard(){
    const stage=document.getElementById('stage');
    if(!stage || stage.dataset.v86Gesture)return;
    stage.dataset.v86Gesture='1';
    let sx=0,sy=0,horizontal=false;

    stage.addEventListener('touchstart',e=>{
      if(!document.body.classList.contains('homeFixed'))return;
      const t=e.touches[0];
      sx=t.clientX; sy=t.clientY; horizontal=false;
    },{passive:true});

    stage.addEventListener('touchmove',e=>{
      if(!document.body.classList.contains('homeFixed'))return;
      const t=e.touches[0];
      const dx=Math.abs(t.clientX-sx), dy=Math.abs(t.clientY-sy);
      if(!horizontal && dx>8 && dx>dy*1.15) horizontal=true;
      if(horizontal && e.cancelable)e.preventDefault();
    },{passive:false});
  }

  document.addEventListener('DOMContentLoaded',()=>{
    syncView();
    resizeGreeting();
    installCarouselGestureGuard();

    const panel=document.getElementById('panel');
    if(panel){
      new MutationObserver(()=>setTimeout(syncView,0))
        .observe(panel,{attributes:true,attributeFilter:['class']});
    }

    const g=greetingEl();
    if(g){
      new MutationObserver(resizeGreeting)
        .observe(g,{childList:true,characterData:true,subtree:true});
    }
  });

  document.addEventListener('click',()=>setTimeout(syncView,30),true);
  window.addEventListener('pageshow',()=>{forceUnlockIfSafe();syncView();});
})();
</script>


<script id="v87CanonicalOrder">
(function(){
  const ORDER=['FAVORITE','MEMORY','DAILY','BEAUTY','SPENDING','HEALTH'];

  function enforceOrder(){
    const cards=[...document.querySelectorAll('.card[data-key]')];
    if(cards.length!==6)return;
    const parent=cards[0].parentElement;
    ORDER.forEach(key=>{
      const c=cards.find(x=>x.dataset.key===key);
      if(c)parent.appendChild(c);
    });
  }

  function enforceAfterRender(){
    requestAnimationFrame(()=>{
      enforceOrder();
      requestAnimationFrame(enforceOrder);
    });
  }

  document.addEventListener('DOMContentLoaded',enforceAfterRender);
  document.addEventListener('click',()=>setTimeout(enforceAfterRender,40),true);
  window.addEventListener('pageshow',enforceAfterRender);

  const root=document.getElementById('stage') || document.body;
  new MutationObserver(enforceAfterRender).observe(root,{childList:true,subtree:true});
})();
</script>


<script id="v91MemoryMoodTapFix">
(function(){
  function chooseMood(btn){
    if(!btn)return;
    const hidden=document.getElementById('memoryMood');
    if(hidden) hidden.value=btn.dataset.mood||'';
    document.querySelectorAll('#moodPicker button[data-mood]').forEach(x=>{
      x.classList.toggle('selected',x===btn);
      x.setAttribute('aria-pressed',x===btn?'true':'false');
    });
  }

  const picker=document.getElementById('moodPicker');
  if(picker){
    picker.addEventListener('pointerup',function(e){
      const b=e.target.closest('button[data-mood]');
      if(!b)return;
      e.preventDefault();
      e.stopPropagation();
      chooseMood(b);
    });
  }

  /* 每次新增回憶時確保表單本身可互動 */
  const add=document.getElementById('addModal');
  if(add){
    new MutationObserver(()=>{
      if(add.classList.contains('on')){
        add.style.pointerEvents='auto';
        const sheet=add.querySelector('.sheet');
        if(sheet)sheet.style.pointerEvents='auto';
      }
    }).observe(add,{attributes:true,attributeFilter:['class']});
  }
})();
</script>





<script id="v93MemoryPhotoDelete">
(function(){
  const input=document.getElementById('memoryPhotos');
  const preview=document.getElementById('memoryPhotoPreview');
  if(!input||!preview)return;

  let files=[];

  function setInputFiles(){
    const dt=new DataTransfer();
    files.forEach(f=>dt.items.add(f));
    input.files=dt.files;
  }

  function draw(){
    preview.innerHTML='';
    files.forEach((file,i)=>{
      const box=document.createElement('div');
      box.className='memoryPreviewItem';

      const img=document.createElement('img');
      const url=URL.createObjectURL(file);
      img.src=url;
      img.onload=()=>URL.revokeObjectURL(url);

      const del=document.createElement('button');
      del.type='button';
      del.className='memoryPhotoRemove';
      del.textContent='×';
      del.setAttribute('aria-label','刪除這張照片');
      del.onclick=function(e){
        e.preventDefault();
        e.stopPropagation();
        files.splice(i,1);
        setInputFiles();
        draw();
      };

      box.append(img,del);
      preview.appendChild(box);
    });
  }

  /* capture phase runs before the app's original onchange property handler */
  input.addEventListener('change',function(){
    files=[...input.files];
    setTimeout(draw,0);
  },true);

  document.addEventListener('click',function(e){
    const opener=e.target.closest('#memoryAddBtn,#directMemoryBtn');
    if(opener){
      files=[];
      input.value='';
      preview.innerHTML='';
    }
  },true);
})();
</script>

  <span class="saveToastIcon">✓</span>
  <span>儲存成功</span>
</div>


<script id="v95ToastController">
(function(){
  let toastTimer=null;
  window.showSaveSuccess=function(message){
    const t=document.getElementById('saveSuccessToast');
    if(!t)return;
    const label=t.querySelector('span:last-child');
    if(label)label.textContent=message||'儲存成功';
    clearTimeout(toastTimer);
    t.classList.remove('show');
    void t.offsetWidth;
    t.classList.add('show');
    toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
  };
})();
</script>
