<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>我的還款紀錄</title><style>
:root{--bg:#f4f0e8;--paper:#fffdf8;--card:#fffdfa;--text:#26312b;--muted:#7d837b;--sage:#708b77;--sage2:#9caf9c;--sageSoft:#e7eee6;--brown:#8a684d;--brownSoft:#efe4d8;--line:#e8e1d7;--danger:#b85f55;--gold:#bd9152;--shadow:0 12px 34px rgba(65,72,62,.09)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,#e5ece2 0,transparent 26%),linear-gradient(180deg,#f8f5ef,#f1ede5);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:920px;margin:auto;padding:34px 18px 105px}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:32px;font-weight:700;margin:0 0 6px;letter-spacing:1px}.sub{color:var(--muted);font-size:14px;margin-bottom:24px}.sub:after{content:"  ·  Better money, better life";font-family:Georgia,serif;font-style:italic;color:#9b8069}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}.card{background:rgba(255,253,248,.94);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:19px;box-shadow:var(--shadow);margin-bottom:14px}.summary .card{margin:0;position:relative;overflow:hidden;min-height:112px}.summary .card:before{content:"";position:absolute;width:66px;height:66px;border-radius:50%;right:-19px;top:-22px;background:var(--sageSoft);opacity:.9}.summary .card:nth-child(2):before{background:var(--brownSoft)}.summary .card:nth-child(3):before{background:#e7edf0}.summary .card:nth-child(4){background:linear-gradient(145deg,#dfe9dc,#eef3e9);border:1px solid #f9fbf7}.label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.2px}.money{font-size:22px;font-weight:850;margin-top:8px;letter-spacing:-.5px;color:#345343}.summary .card:nth-child(2) .money{color:#80523d}.summary .card:nth-child(3) .money{color:#435c69}.section{display:flex;align-items:center;justify-content:space-between;margin:31px 3px 12px}.section h2{font-family:Georgia,"Noto Serif TC",serif;font-size:20px;margin:0}.section h2:before{content:"";display:inline-block;width:6px;height:19px;border-radius:99px;background:var(--sage);vertical-align:-3px;margin-right:9px}.section{cursor:pointer}.section>button{cursor:pointer}.collapse-arrow{margin-left:auto;margin-right:10px;width:34px;height:34px;padding:0;border-radius:50%;background:var(--sageSoft);color:#52685a;box-shadow:none;font-size:18px;display:grid;place-items:center}.collapse-arrow.open{transform:rotate(180deg)}.collapsible{overflow:hidden;transition:max-height .28s ease,opacity .22s ease}.collapsible.closed{display:none}button{border:0;border-radius:13px;padding:10px 14px;font-weight:750;cursor:pointer;background:var(--sage);color:#fff;box-shadow:0 5px 14px rgba(70,99,77,.13);transition:.18s}button:hover{transform:translateY(-1px);filter:brightness(.98)}.ghost{background:var(--sageSoft);color:#52685a;box-shadow:none}.danger{background:#f8e9e6;color:var(--danger);box-shadow:none}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}.row:last-child{border-bottom:0}.big{font-size:27px;font-weight:850;letter-spacing:-.7px;color:#3e5848}.progress{height:9px;background:#e9ebe5;border-radius:99px;overflow:hidden;margin:14px 0 9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#a8bda7,#718e78);border-radius:99px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.debt{transition:.2s;border-left:4px solid #a8b9aa}.debt:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(61,72,63,.12)}.debt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.debt h3{margin:0 0 5px;font-size:18px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.empty{text-align:center;color:var(--muted);padding:34px 8px;border:1px dashed #d8d3c9;background:rgba(255,253,248,.65);box-shadow:none}.empty:before{content:"🌿";display:block;font-size:25px;margin-bottom:8px;filter:saturate(.55)}dialog{border:0;border-radius:24px;padding:0;max-width:500px;width:calc(100% - 28px);box-shadow:0 30px 90px rgba(45,52,46,.25);background:#fffdf8}dialog::backdrop{background:rgba(40,46,41,.42);backdrop-filter:blur(3px)}form{padding:24px}form h3{margin:0 0 19px;font-size:21px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 7px;color:#626a63}input,textarea{width:100%;border:1px solid #dedbd2;border-radius:13px;padding:12px 13px;font:inherit;background:#fff;outline:none;transition:.15s}input:focus,textarea:focus{border-color:#91a792;box-shadow:0 0 0 3px rgba(112,139,119,.13)}textarea{min-height:76px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:21px}.history{margin-top:14px;background:#f7f5ef;border-radius:16px;padding:0 12px}.history-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.history-item:first-child{border-top:0}.history-item button{padding:6px 9px;font-size:12px}.card b{font-weight:780}body:before{content:"";position:fixed;left:0;bottom:0;width:160px;height:210px;pointer-events:none;opacity:.18;background:radial-gradient(ellipse at 25% 100%,#6e8b70 0 12%,transparent 13%),radial-gradient(ellipse at 45% 76%,#8fa48e 0 10%,transparent 11%),radial-gradient(ellipse at 18% 62%,#7c997e 0 9%,transparent 10%);z-index:-1}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.wrap{padding-top:24px}.sub:after{display:block;margin-top:4px}.summary .card{min-height:100px}}@media(max-width:480px){.wrap{padding:20px 13px 88px}h1{font-size:28px}.summary{gap:9px}.summary .card{padding:15px;border-radius:18px;min-height:94px}.money{font-size:19px}.card{border-radius:19px;padding:16px}.section{margin-top:25px}.section h2{font-size:18px}.section button{padding:9px 11px}.debt-head .big{font-size:22px}.actions button{flex:1}}
</style></head><body><div class='wrap'><h1>我的還款紀錄</h1><div class='sub'>媽媽帳務與其他債務分開管理</div><div class='summary'><div class='card'><div class='label'>本月進帳</div><div class='money' id='incomeTotal'>$0</div></div><div class='card'><div class='label'>累積欠媽媽</div><div class='money' id='momTotal'>$0</div></div><div class='card'><div class='label'>其他債務剩餘</div><div class='money' id='debtTotal'>$0</div></div><div class='card'><div class='label'>總待償還</div><div class='money' id='grandTotal'>$0</div></div></div><div class='section'><h2>本月</h2><span class='muted' id='currentMonthLabel'></span></div><div id='currentMonthPanel'></div><div class='section' onclick="toggleSection('incomeSection','incomeArrow')"><h2>每月進帳</h2><button id='incomeArrow' class='collapse-arrow open' type='button' onclick="event.stopPropagation();toggleSection('incomeSection','incomeArrow')">⌄</button><button onclick='event.stopPropagation();openIncome()'>＋ 新增進帳</button></div><div id='incomeSection' class='collapsible'><div id='incomeList'></div></div>
<div class='section' onclick="toggleSection('momSection','momArrow')"><h2>媽媽帳務</h2><button id='momArrow' class='collapse-arrow open' type='button' onclick="event.stopPropagation();toggleSection('momSection','momArrow')">⌄</button><button onclick='event.stopPropagation();openMom()'>＋ 新增月份</button></div><div id='momSection' class='collapsible'><div id='momList'></div></div>
<div class='section' onclick="toggleSection('debtSection','debtArrow')"><h2>我的債務</h2><button id='debtArrow' class='collapse-arrow open' type='button' onclick="event.stopPropagation();toggleSection('debtSection','debtArrow')">⌄</button><button onclick='event.stopPropagation();openDebt()'>＋ 新增債務</button></div><div id='debtSection' class='collapsible'><div id='debtList'></div></div><div class='section' onclick="toggleSection('backupSection','backupArrow')"><h2>資料備份</h2><button id='backupArrow' class='collapse-arrow' type='button' onclick="event.stopPropagation();toggleSection('backupSection','backupArrow')">⌄</button></div><div id='backupSection' class='collapsible closed'><div class='card'><div class='debt-head'><div><b>備份與還原</b><div class='muted'>把所有進帳、媽媽帳務、債務與還款紀錄備份成檔案。換手機或清除瀏覽器資料後，可用備份檔還原。</div></div></div><div class='actions'><button onclick='exportBackup()'>↓ 匯出備份</button><button class='ghost' onclick='document.getElementById("backupFile").click()'>↑ 匯入備份</button></div><input id='backupFile' type='file' accept='.json,application/json' style='display:none' onchange='importBackup(event)'><div class='muted' id='backupStatus' style='margin-top:12px'></div></div></div></div>
<dialog id='incomeDlg'><form onsubmit='saveIncome(event)'><h3 id='incomeTitle'>新增進帳</h3><input type='hidden' id='incomeId'><label>月份</label><input id='incomeMonth' type='month' required><label>進帳金額</label><input id='incomeAmount' type='number' min='0' required placeholder='例如：80000'><label>備註</label><textarea id='incomeNote' placeholder='例如：薪水、獎金、其他收入'></textarea><div class='form-actions'><button type='button' class='ghost' onclick='incomeDlg.close()'>取消</button><button>儲存</button></div></form></dialog><dialog id='momDlg'><form onsubmit='saveMom(event)'><h3 id='momTitle'>新增月份紀錄</h3><input type='hidden' id='momId'><label>月份</label><input id='momMonth' type='month' required><label>每月應付金額</label><input id='momBase' type='number' min='0' value='45000' required><label>信貸扣除</label><input id='momLoan' type='number' min='0' value='17165'><label>台新週轉金扣除</label><input id='momTaishin' type='number' min='0' value='0'><label>其他扣除</label><input id='momOther' type='number' min='0' value='0'><label>實際給媽媽</label><input id='momPaid' type='number' min='0' value='0'><label>備註</label><textarea id='momNote'></textarea><div class='form-actions'><button type='button' class='ghost' onclick='momDlg.close()'>取消</button><button>儲存</button></div></form></dialog>
<dialog id='debtDlg'><form onsubmit='saveDebt(event)'><h3 id='debtTitle'>新增債務</h3><input type='hidden' id='debtId'><label>債務名稱</label><input id='debtName' required placeholder='例如：手機貸'><label>原始欠款</label><input id='debtOriginal' type='number' min='0' required><label>開始日期</label><input id='debtStart' type='date'><label>每月預計還款</label><input id='debtMonthly' type='number' min='0'><label>每月繳款日</label><input id='debtDay' type='number' min='1' max='31'><label>備註</label><textarea id='debtNote'></textarea><div class='form-actions'><button type='button' class='ghost' onclick='debtDlg.close()'>取消</button><button>儲存</button></div></form></dialog>
<dialog id='payDlg'><form onsubmit='savePayment(event)'><h3>新增還款</h3><input type='hidden' id='payDebtId'><label>還款日期</label><input id='payDate' type='date' required><label>還款金額</label><input id='payAmount' type='number' min='0' required><label>備註</label><input id='payNote'><div class='form-actions'><button type='button' class='ghost' onclick='payDlg.close()'>取消</button><button>儲存</button></div></form></dialog>
<script>
const K='my-debt-tracker-v1';let data=JSON.parse(localStorage.getItem(K)||'{"mom":[],"debts":[],"income":[]}');data.income=data.income||[];const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n||0);const persist=()=>{localStorage.setItem(K,JSON.stringify(data));render()};
function momCalc(x){let due=Number(x.base)-Number(x.loan)-Number(x.taishin)-Number(x.other);return {due:Math.max(0,due),short:Math.max(0,due-Number(x.paid)),over:Math.max(0,Number(x.paid)-due)}}
function render(){let nowMonth=new Date().toISOString().slice(0,7);let currentIncome=data.income.filter(x=>x.month===nowMonth).reduce((s,x)=>s+Number(x.amount),0);let currentMom=data.mom.filter(x=>x.month===nowMonth);let currentMomDue=currentMom.reduce((s,x)=>s+momCalc(x).due,0),currentMomPaid=currentMom.reduce((s,x)=>s+Number(x.paid||0),0),currentMomShort=Math.max(0,currentMomDue-currentMomPaid);$('currentMonthLabel').textContent=nowMonth.replace('-',' 年 ')+' 月';$('currentMonthPanel').innerHTML=`<div class='card'><div class='debt-head'><div><b>這個月的紀錄</b><div class='muted'>打開網頁先看本月，完整紀錄需要時再展開</div></div></div><div class='grid'><div><div class='label'>本月進帳</div><div class='big'>${money(currentIncome)}</div></div><div><div class='label'>本月應給媽媽</div><div class='big'>${money(currentMomDue)}</div></div><div><div class='label'>本月已給媽媽</div><div class='big'>${money(currentMomPaid)}</div></div><div><div class='label'>本月還差</div><div class='big'>${money(currentMomShort)}</div></div></div></div>`;$('incomeTotal').textContent=money(currentIncome);$('incomeList').innerHTML=data.income.length?[...data.income].sort((a,b)=>b.month.localeCompare(a.month)).map(x=>`<div class='card'><div class='debt-head'><div><b>${x.month.replace('-',' 年 ')} 月</b><div class='muted'>${x.note?esc(x.note):'每月進帳紀錄'}</div></div><div class='big'>${money(x.amount)}</div></div><div class='actions'><button class='ghost' onclick='editIncome("${x.id}")'>編輯</button><button class='danger' onclick='delIncome("${x.id}")'>刪除</button></div></div>`).join(''):`<div class='card empty'>還沒有進帳紀錄，按「新增進帳」開始</div>`;let running=0;const moms=[...data.mom].sort((a,b)=>a.month.localeCompare(b.month));moms.forEach(x=>{const c=momCalc(x);running=Math.max(0,running+c.short-c.over)});$('momTotal').textContent=money(running);let debtRemaining=data.debts.reduce((s,d)=>s+Math.max(0,Number(d.original)-(d.payments||[]).reduce((a,p)=>a+Number(p.amount),0)),0);$('debtTotal').textContent=money(debtRemaining);$('grandTotal').textContent=money(running+debtRemaining);
$('momList').innerHTML=data.mom.length?[...data.mom].sort((a,b)=>b.month.localeCompare(a.month)).map(x=>{const c=momCalc(x);return `<div class='card'><div class='debt-head'><div><b>${x.month.replace('-',' 年 ')} 月</b><div class='muted'>應付 ${money(x.base)}</div></div><div class='big'>${money(c.short)}</div></div><div class='row'><span>信貸</span><span>− ${money(x.loan)}</span></div><div class='row'><span>台新週轉金</span><span>− ${money(x.taishin)}</span></div>${Number(x.other)?`<div class='row'><span>其他扣除</span><span>− ${money(x.other)}</span></div>`:''}<div class='row'><b>扣除後應給</b><b>${money(c.due)}</b></div><div class='row'><span>實際已給</span><span>${money(x.paid)}</span></div>${x.note?`<div class='muted' style='margin-top:8px'>${esc(x.note)}</div>`:''}<div class='actions'><button class='ghost' onclick='editMom("${x.id}")'>編輯</button><button class='danger' onclick='delMom("${x.id}")'>刪除</button></div></div>`}).join(''):`<div class='card empty'>還沒有月份紀錄</div>`;
$('debtList').innerHTML=data.debts.length?data.debts.map(d=>{let paid=(d.payments||[]).reduce((a,p)=>a+Number(p.amount),0),remain=Math.max(0,Number(d.original)-paid),pct=d.original?Math.min(100,paid/d.original*100):0;return `<div class='card debt'><div class='debt-head'><div><h3>${esc(d.name)}</h3><div class='muted'>原始欠款 ${money(d.original)}</div></div><div><div class='label'>剩餘</div><div class='money'>${money(remain)}</div></div></div><div class='progress'><i style='width:${pct}%'></i></div><div class='muted'>已還 ${money(paid)} · ${pct.toFixed(0)}%</div><div class='actions'><button onclick='openPay("${d.id}")'>＋ 還款</button><button class='ghost' onclick='toggleHistory("${d.id}")'>還款紀錄</button><button class='ghost' onclick='editDebt("${d.id}")'>編輯</button><button class='danger' onclick='delDebt("${d.id}")'>刪除</button></div><div class='history' id='hist-${d.id}' style='display:none'>${(d.payments||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<div class='history-item'><div><b>${money(p.amount)}</b><div class='muted'>${p.date}${p.note?' · '+esc(p.note):''}</div></div><button class='danger' onclick='delPayment("${d.id}","${p.id}")'>刪除</button></div>`).join('')||`<div class='muted'>尚無還款紀錄</div>`}</div></div>`}).join(''):`<div class='card empty'>還沒有其他債務，按「新增債務」開始</div>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function openIncome(){['incomeId','incomeNote'].forEach(i=>$(i).value='');$('incomeMonth').value=new Date().toISOString().slice(0,7);$('incomeAmount').value='';$('incomeTitle').textContent='新增進帳';incomeDlg.showModal()}
function saveIncome(e){e.preventDefault();let id=$('incomeId').value||crypto.randomUUID(),x={id,month:$('incomeMonth').value,amount:+$('incomeAmount').value,note:$('incomeNote').value};let i=data.income.findIndex(v=>v.id===id);i>=0?data.income[i]=x:data.income.push(x);incomeDlg.close();persist()}
function editIncome(id){let x=data.income.find(v=>v.id===id);$('incomeId').value=x.id;$('incomeMonth').value=x.month;$('incomeAmount').value=x.amount;$('incomeNote').value=x.note||'';$('incomeTitle').textContent='編輯進帳';incomeDlg.showModal()}
function delIncome(id){if(confirm('確定刪除這筆進帳紀錄？')){data.income=data.income.filter(x=>x.id!==id);persist()}}
function openMom(){['momId','momNote'].forEach(i=>$(i).value='');$('momMonth').value=new Date().toISOString().slice(0,7);$('momBase').value=45000;$('momLoan').value=17165;$('momTaishin').value=0;$('momOther').value=0;$('momPaid').value=0;$('momTitle').textContent='新增月份紀錄';momDlg.showModal()}
function saveMom(e){e.preventDefault();let id=$('momId').value||crypto.randomUUID(),x={id,month:$('momMonth').value,base:+$('momBase').value,loan:+$('momLoan').value,taishin:+$('momTaishin').value,other:+$('momOther').value,paid:+$('momPaid').value,note:$('momNote').value};let i=data.mom.findIndex(v=>v.id===id);i>=0?data.mom[i]=x:data.mom.push(x);momDlg.close();persist()}
function editMom(id){let x=data.mom.find(v=>v.id===id);Object.entries({momId:x.id,momMonth:x.month,momBase:x.base,momLoan:x.loan,momTaishin:x.taishin,momOther:x.other,momPaid:x.paid,momNote:x.note||''}).forEach(([k,v])=>$(k).value=v);$('momTitle').textContent='編輯月份紀錄';momDlg.showModal()}function delMom(id){if(confirm('確定刪除這個月份？')){data.mom=data.mom.filter(x=>x.id!==id);persist()}}
function openDebt(){['debtId','debtName','debtOriginal','debtStart','debtMonthly','debtDay','debtNote'].forEach(i=>$(i).value='');$('debtTitle').textContent='新增債務';debtDlg.showModal()}function saveDebt(e){e.preventDefault();let id=$('debtId').value||crypto.randomUUID(),old=data.debts.find(x=>x.id===id),d={id,name:$('debtName').value,original:+$('debtOriginal').value,start:$('debtStart').value,monthly:+$('debtMonthly').value||0,day:+$('debtDay').value||0,note:$('debtNote').value,payments:old?.payments||[]};let i=data.debts.findIndex(x=>x.id===id);i>=0?data.debts[i]=d:data.debts.push(d);debtDlg.close();persist()}function editDebt(id){let d=data.debts.find(x=>x.id===id);Object.entries({debtId:d.id,debtName:d.name,debtOriginal:d.original,debtStart:d.start||'',debtMonthly:d.monthly||'',debtDay:d.day||'',debtNote:d.note||''}).forEach(([k,v])=>$(k).value=v);$('debtTitle').textContent='編輯債務';debtDlg.showModal()}function delDebt(id){if(confirm('確定刪除此債務與所有還款紀錄？')){data.debts=data.debts.filter(x=>x.id!==id);persist()}}
function openPay(id){$('payDebtId').value=id;$('payDate').value=new Date().toISOString().slice(0,10);$('payAmount').value='';$('payNote').value='';payDlg.showModal()}function savePayment(e){e.preventDefault();let d=data.debts.find(x=>x.id===$('payDebtId').value);d.payments.push({id:crypto.randomUUID(),date:$('payDate').value,amount:+$('payAmount').value,note:$('payNote').value});payDlg.close();persist()}function delPayment(did,pid){if(confirm('刪除這筆還款紀錄？')){let d=data.debts.find(x=>x.id===did);d.payments=d.payments.filter(p=>p.id!==pid);persist()}}function toggleHistory(id){let e=$('hist-'+id);e.style.display=e.style.display==='none'?'block':'none'}


function toggleSection(sectionId,arrowId){
  const section=$(sectionId), arrow=$(arrowId);
  const willClose=!section.classList.contains('closed');
  section.classList.toggle('closed',willClose);
  arrow.classList.toggle('open',!willClose);
}
function restoreSections(){
  ['incomeSection','momSection','debtSection','backupSection'].forEach(id=>{
    $(id)?.classList.add('closed');
    $(id.replace('Section','Arrow'))?.classList.remove('open');
  });
}

function exportBackup(){
  const payload={app:'my-debt-tracker',version:1,exportedAt:new Date().toISOString(),data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,10).replaceAll('-','');
  a.href=URL.createObjectURL(blob);a.download=`還款紀錄備份-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
  $('backupStatus').textContent='已匯出備份。請把檔案保存到安全的位置。';
}
function importBackup(e){
  const file=e.target.files?.[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{try{
    const parsed=JSON.parse(reader.result); const incoming=parsed.data||parsed;
    if(!incoming || !Array.isArray(incoming.mom) || !Array.isArray(incoming.debts)) throw new Error('invalid');
    incoming.income=Array.isArray(incoming.income)?incoming.income:[];
    if(!confirm('匯入備份會取代目前這個瀏覽器裡的資料。確定要繼續嗎？')){e.target.value='';return;}
    data=incoming;localStorage.setItem(K,JSON.stringify(data));render();
    $('backupStatus').textContent=`已成功還原：${file.name}`;
  }catch(err){alert('這個檔案不是有效的還款紀錄備份，請確認檔案後再試一次。')}finally{e.target.value=''}};
  reader.readAsText(file);
}
render();restoreSections();
</script></body></html>
