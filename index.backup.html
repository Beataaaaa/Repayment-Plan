<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>我的還款紀錄</title><style>
:root{--bg:#f7f5f2;--card:rgba(255,255,255,.92);--text:#27231f;--muted:#8b8178;--accent:#6f5b4c;--accent2:#b89a82;--soft:#f0e9e2;--line:#eee7e0;--danger:#b85c5c;--green:#6f8b78;--shadow:0 12px 35px rgba(91,70,54,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#efe4da 0,transparent 34%),linear-gradient(180deg,#faf8f5 0,#f5f2ee 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:auto;padding:34px 18px 100px}h1{font-size:30px;letter-spacing:-.5px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin-bottom:24px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:30px}.card{background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:19px;box-shadow:var(--shadow);margin-bottom:14px;backdrop-filter:blur(10px)}.summary .card{margin:0;position:relative;overflow:hidden}.summary .card:before{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-25px;top:-25px;background:var(--soft)}.summary .card:nth-child(3){background:linear-gradient(145deg,#6f5b4c,#8c7462);color:white}.summary .card:nth-child(3) .label{color:#eee5de}.label{color:var(--muted);font-size:12px;font-weight:650}.money{font-size:23px;font-weight:800;margin-top:6px;letter-spacing:-.5px}.section{display:flex;align-items:center;justify-content:space-between;margin:30px 3px 12px}.section h2{font-size:19px;margin:0;letter-spacing:-.2px}.section h2:before{content:"";display:inline-block;width:5px;height:18px;border-radius:99px;background:var(--accent2);vertical-align:-3px;margin-right:9px}button{border:0;border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(111,91,76,.13);transition:.18s}button:hover{transform:translateY(-1px)}.ghost{background:var(--soft);color:#62564d;box-shadow:none}.danger{background:#f9ece9;color:var(--danger);box-shadow:none}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}.row:last-child{border-bottom:0}.big{font-size:27px;font-weight:850;letter-spacing:-.7px}.progress{height:9px;background:#eee8e2;border-radius:99px;overflow:hidden;margin:14px 0 9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--green));border-radius:99px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.debt{transition:.2s}.debt:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(91,70,54,.11)}.debt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.debt h3{margin:0 0 5px;font-size:18px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.empty{text-align:center;color:var(--muted);padding:34px 8px;border:1px dashed #ded4cb;background:rgba(255,255,255,.55);box-shadow:none}dialog{border:0;border-radius:26px;padding:0;max-width:500px;width:calc(100% - 28px);box-shadow:0 30px 90px rgba(57,43,33,.28);background:#fcfbf9}dialog::backdrop{background:rgba(46,37,31,.42);backdrop-filter:blur(3px)}form{padding:24px}form h3{margin:0 0 19px;font-size:21px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 7px;color:#62584f}input,textarea{width:100%;border:1px solid #e4ddd6;border-radius:14px;padding:12px 13px;font:inherit;background:white;outline:none;transition:.15s}input:focus,textarea:focus{border-color:#b99e88;box-shadow:0 0 0 3px rgba(185,158,136,.14)}textarea{min-height:76px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:21px}.history{margin-top:14px;background:#faf7f4;border-radius:16px;padding:0 12px}.history-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.history-item:first-child{border-top:0}.history-item button{padding:6px 9px;font-size:12px}.card b{font-weight:780}@media(max-width:620px){.wrap{padding:22px 14px 90px}.summary{grid-template-columns:1fr 1fr}.summary .card:nth-child(3){grid-column:1/-1}.summary .card{padding:16px}.money{font-size:21px}.card{border-radius:20px;padding:17px}.section{margin-top:25px}.section button{padding:9px 11px}.debt-head .big{font-size:23px}}@media(max-width:390px){h1{font-size:27px}.summary{grid-template-columns:1fr}.summary .card:nth-child(3){grid-column:auto}.actions button{flex:1}.debt-head{align-items:flex-start}}
</style></head><body><div class='wrap'><h1>我的還款紀錄</h1><div class='sub'>媽媽帳務與其他債務分開管理</div><div class='summary'><div class='card'><div class='label'>本月進帳</div><div class='money' id='incomeTotal'>$0</div></div><div class='card'><div class='label'>累積欠媽媽</div><div class='money' id='momTotal'>$0</div></div><div class='card'><div class='label'>其他債務剩餘</div><div class='money' id='debtTotal'>$0</div></div><div class='card'><div class='label'>總待償還</div><div class='money' id='grandTotal'>$0</div></div></div><div class='section'><h2>每月進帳</h2><button onclick='openIncome()'>＋ 新增進帳</button></div><div id='incomeList'></div>
<div class='section'><h2>媽媽帳務</h2><button onclick='openMom()'>＋ 新增月份</button></div><div id='momList'></div>
<div class='section'><h2>我的債務</h2><button onclick='openDebt()'>＋ 新增債務</button></div><div id='debtList'></div></div>
<dialog id='incomeDlg'><form onsubmit='saveIncome(event)'><h3 id='incomeTitle'>新增進帳</h3><input type='hidden' id='incomeId'><label>月份</label><input id='incomeMonth' type='month' required><label>進帳金額</label><input id='incomeAmount' type='number' min='0' required placeholder='例如：80000'><label>備註</label><textarea id='incomeNote' placeholder='例如：薪水、獎金、其他收入'></textarea><div class='form-actions'><button type='button' class='ghost' onclick='incomeDlg.close()'>取消</button><button>儲存</button></div></form></dialog><dialog id='momDlg'><form onsubmit='saveMom(event)'><h3 id='momTitle'>新增月份紀錄</h3><input type='hidden' id='momId'><label>月份</label><input id='momMonth' type='month' required><label>每月應付金額</label><input id='momBase' type='number' min='0' value='45000' required><label>信貸扣除</label><input id='momLoan' type='number' min='0' value='17165'><label>台新週轉金扣除</label><input id='momTaishin' type='number' min='0' value='0'><label>其他扣除</label><input id='momOther' type='number' min='0' value='0'><label>實際給媽媽</label><input id='momPaid' type='number' min='0' value='0'><label>備註</label><textarea id='momNote'></textarea><div class='form-actions'><button type='button' class='ghost' onclick='momDlg.close()'>取消</button><button>儲存</button></div></form></dialog>
<dialog id='debtDlg'><form onsubmit='saveDebt(event)'><h3 id='debtTitle'>新增債務</h3><input type='hidden' id='debtId'><label>債務名稱</label><input id='debtName' required placeholder='例如：手機貸'><label>原始欠款</label><input id='debtOriginal' type='number' min='0' required><label>開始日期</label><input id='debtStart' type='date'><label>每月預計還款</label><input id='debtMonthly' type='number' min='0'><label>每月繳款日</label><input id='debtDay' type='number' min='1' max='31'><label>備註</label><textarea id='debtNote'></textarea><div class='form-actions'><button type='button' class='ghost' onclick='debtDlg.close()'>取消</button><button>儲存</button></div></form></dialog>
<dialog id='payDlg'><form onsubmit='savePayment(event)'><h3>新增還款</h3><input type='hidden' id='payDebtId'><label>還款日期</label><input id='payDate' type='date' required><label>還款金額</label><input id='payAmount' type='number' min='0' required><label>備註</label><input id='payNote'><div class='form-actions'><button type='button' class='ghost' onclick='payDlg.close()'>取消</button><button>儲存</button></div></form></dialog>
<script>
const K='my-debt-tracker-v1';let data=JSON.parse(localStorage.getItem(K)||'{"mom":[],"debts":[],"income":[]}');data.income=data.income||[];const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n||0);const persist=()=>{localStorage.setItem(K,JSON.stringify(data));render()};
function momCalc(x){let due=Number(x.base)-Number(x.loan)-Number(x.taishin)-Number(x.other);return {due:Math.max(0,due),short:Math.max(0,due-Number(x.paid)),over:Math.max(0,Number(x.paid)-due)}}
function render(){let nowMonth=new Date().toISOString().slice(0,7);let currentIncome=data.income.filter(x=>x.month===nowMonth).reduce((s,x)=>s+Number(x.amount),0);$('incomeTotal').textContent=money(currentIncome);$('incomeList').innerHTML=data.income.length?[...data.income].sort((a,b)=>b.month.localeCompare(a.month)).map(x=>`<div class='card'><div class='debt-head'><div><b>${x.month.replace('-',' 年 ')} 月</b><div class='muted'>${x.note?esc(x.note):'每月進帳紀錄'}</div></div><div class='big'>${money(x.amount)}</div></div><div class='actions'><button class='ghost' onclick='editIncome("${x.id}")'>編輯</button><button class='danger' onclick='delIncome("${x.id}")'>刪除</button></div></div>`).join(''):`<div class='card empty'>還沒有進帳紀錄，按「新增進帳」開始</div>`;let running=0;const moms=[...data.mom].sort((a,b)=>a.month.localeCompare(b.month));moms.forEach(x=>{const c=momCalc(x);running=Math.max(0,running+c.short-c.over)});$('momTotal').textContent=money(running);let debtRemaining=data.debts.reduce((s,d)=>s+Math.max(0,Number(d.original)-(d.payments||[]).reduce((a,p)=>a+Number(p.amount),0)),0);$('debtTotal').textContent=money(debtRemaining);$('grandTotal').textContent=money(running+debtRemaining);
$('momList').innerHTML=data.mom.length?[...data.mom].sort((a,b)=>b.month.localeCompare(a.month)).map(x=>{const c=momCalc(x);return `<div class='card'><div class='debt-head'><div><b>${x.month.replace('-',' 年 ')} 月</b><div class='muted'>應付 ${money(x.base)}</div></div><div class='big'>${money(c.short)}</div></div><div class='row'><span>信貸</span><span>− ${money(x.loan)}</span></div><div class='row'><span>台新週轉金</span><span>− ${money(x.taishin)}</span></div>${Number(x.other)?`<div class='row'><span>其他扣除</span><span>− ${money(x.other)}</span></div>`:''}<div class='row'><b>扣除後應給</b><b>${money(c.due)}</b></div><div class='row'><span>實際已給</span><span>${money(x.paid)}</span></div>${x.note?`<div class='muted' style='margin-top:8px'>${esc(x.note)}</div>`:''}<div class='actions'><button class='ghost' onclick='editMom("${x.id}")'>編輯</button><button class='danger' onclick='delMom("${x.id}")'>刪除</button></div></div>`}).join(''):`<div class='card empty'>還沒有月份紀錄</div>`;
$('debtList').innerHTML=data.debts.length?data.debts.map(d=>{let paid=(d.payments||[]).reduce((a,p)=>a+Number(p.amount),0),remain=Math.max(0,Number(d.original)-paid),pct=d.original?Math.min(100,paid/d.original*100):0;return `<div class='card debt'><div class='debt-head'><div><h3>${esc(d.name)}</h3><div class='muted'>原始欠款 ${money(d.original)}</div></div><div><div class='label'>剩餘</div><div class='money'>${money(remain)}</div></div></div><div class='progress'><i style='width:${pct}%'></i></div><div class='muted'>已還 ${money(paid)} · ${pct.toFixed(0)}%</div><div class='actions'><button onclick='openPay("${d.id}")'>＋ 還款</button><button class='ghost' onclick='toggleHistory("${d.id}")'>還款紀錄</button><button class='ghost' onclick='editDebt("${d.id}")'>編輯</button><button class='danger' onclick='delDebt("${d.id}")'>刪除</button></div><div class='history' id='hist-${d.id}' style='display:none'>${(d.payments||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<div class='history-item'><div><b>${money(p.amount)}</b><div class='muted'>${p.date}${p.note?' · '+esc(p.note):''}</div></div><button class='danger' onclick='delPayment("${d.id}","${p.id}")'>刪除</button></div>`).join('')||`<div class='muted'>尚無還款紀錄</div>`}</div></div>`}).join(''):`<div class='card empty'>還沒有其他債務，按「新增債務」開始</div>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function openIncome(){['incomeId','incomeNote'].forEach(i=>$(i).value='');$('incomeMonth').value=new Date().toISOString().slice(0,7);$('incomeAmount').value='';$('incomeTitle').textContent='新增進帳';incomeDlg.showModal()}
function saveIncome(e){e.preventDefault();let id=$('incomeId').value||crypto.randomUUID(),x={id,month:$('incomeMonth').value,amount:+$('incomeAmount').value,note:$('incomeNote').value};let i=data.income.findIndex(v=>v.id===id);i>=0?data.income[i]=x:data.income.push(x);incomeDlg.close();persist()}
function editIncome(id){let x=data.income.find(v=>v.id===id);$('incomeId').value=x.id;$('incomeMonth').value=x.month;$('incomeAmount').value=x.amount;$('incomeNote').value=x.note||'';$('incomeTitle').textContent='編輯進帳';incomeDlg.showModal()}
function delIncome(id){if(confirm('確定刪除這筆進帳紀錄？')){data.income=data.income.filter(x=>x.id!==id);persist()}}
function openMom(){['momId','momNote'].forEach(i=>$(i).value='');$('momMonth').value=new Date().toISOString().slice(0,7);$('momBase').value=45000;$('momLoan').value=17165;$('momTaishin').value=0;$('momOther').value=0;$('momPaid').value=0;$('momTitle').textContent='新增月份紀錄';momDlg.showModal()}
function saveMom(e){e.preventDefault();let id=$('momId').value||crypto.randomUUID(),x={id,month:$('momMonth').value,base:+$('momBase').value,loan:+$('momLoan').value,taishin:+$('momTaishin').value,other:+$('momOther').value,paid:+$('momPaid').value,note:$('momNote').value};let i=data.mom.findIndex(v=>v.id===id);i>=0?data.mom[i]=x:data.mom.push(x);momDlg.close();persist()}
function editMom(id){let x=data.mom.find(v=>v.id===id);Object.entries({momId:x.id,momMonth:x.month,momBase:x.base,momLoan:x.loan,momTaishin:x.taishin,momOther:x.other,momPaid:x.paid,momNote:x.note||''}).forEach(([k,v])=>$(k).value=v);$('momTitle').textContent='編輯月份紀錄';momDlg.showModal()}function delMom(id){if(confirm('確定刪除這個月份？')){data.mom=data.mom.filter(x=>x.id!==id);persist()}}
function openDebt(){['debtId','debtName','debtOriginal','debtStart','debtMonthly','debtDay','debtNote'].forEach(i=>$(i).value='');$('debtTitle').textContent='新增債務';debtDlg.showModal()}function saveDebt(e){e.preventDefault();let id=$('debtId').value||crypto.randomUUID(),old=data.debts.find(x=>x.id===id),d={id,name:$('debtName').value,original:+$('debtOriginal').value,start:$('debtStart').value,monthly:+$('debtMonthly').value||0,day:+$('debtDay').value||0,note:$('debtNote').value,payments:old?.payments||[]};let i=data.debts.findIndex(x=>x.id===id);i>=0?data.debts[i]=d:data.debts.push(d);debtDlg.close();persist()}function editDebt(id){let d=data.debts.find(x=>x.id===id);Object.entries({debtId:d.id,debtName:d.name,debtOriginal:d.original,debtStart:d.start||'',debtMonthly:d.monthly||'',debtDay:d.day||'',debtNote:d.note||''}).forEach(([k,v])=>$(k).value=v);$('debtTitle').textContent='編輯債務';debtDlg.showModal()}function delDebt(id){if(confirm('確定刪除此債務與所有還款紀錄？')){data.debts=data.debts.filter(x=>x.id!==id);persist()}}
function openPay(id){$('payDebtId').value=id;$('payDate').value=new Date().toISOString().slice(0,10);$('payAmount').value='';$('payNote').value='';payDlg.showModal()}function savePayment(e){e.preventDefault();let d=data.debts.find(x=>x.id===$('payDebtId').value);d.payments.push({id:crypto.randomUUID(),date:$('payDate').value,amount:+$('payAmount').value,note:$('payNote').value});payDlg.close();persist()}function delPayment(did,pid){if(confirm('刪除這筆還款紀錄？')){let d=data.debts.find(x=>x.id===did);d.payments=d.payments.filter(p=>p.id!==pid);persist()}}function toggleHistory(id){let e=$('hist-'+id);e.style.display=e.style.display==='none'?'block':'none'}render();
</script></body></html>
